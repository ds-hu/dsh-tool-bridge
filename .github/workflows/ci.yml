name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: build · types · tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      # The plugin's @deepseek-ai/* peers are ranges, for the profiles that install
      # it. What is installed *here* is the dev tree, whose versions are pinned in
      # package.json — so CI typechecks and tests against the one harness build the
      # types were read from, not whatever was published that morning.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
